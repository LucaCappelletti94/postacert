[package]
name = "postacert-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jiff = { version = "0.2.39", default-features = false }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
mail-parser = "1.0.1"
postacert = { path = ".." }

[[bin]]
name = "message_parse"
path = "fuzz_targets/message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certification_xml"
path = "fuzz_targets/certification_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outgoing_prepare"
path = "fuzz_targets/outgoing_prepare.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_verify"
path = "fuzz_targets/message_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attachment_check"
path = "fuzz_targets/attachment_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outgoing_build"
path = "fuzz_targets/outgoing_build.rs"
test = false
doc = false
bench = false

[workspace]
